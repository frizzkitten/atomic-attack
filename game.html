<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE BIG ADVENTURE</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10101c;
    font-family: "Trebuchet MS", "Comic Sans MS", Verdana, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    position: relative;
    width: 900px; height: 540px;
    max-width: 100vw; max-height: 100vh;
    aspect-ratio: 900 / 540;
    box-shadow: 0 0 0 4px #2a2a44, 0 0 40px #000;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #ui {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #ui > * { pointer-events: auto; }

  /* ---------- shared UI bits ---------- */
  .panel {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: rgba(12,12,28,0.92);
    border: 4px solid #ffd54a;
    border-radius: 14px;
    padding: 16px 22px;
    text-align: center;
  }
  .title-big {
    font-size: 46px; font-weight: bold; letter-spacing: 2px;
    color: #ffd54a; text-shadow: 4px 4px 0 #a4390b, 0 0 18px #ff8a3d;
  }
  .sub { font-size: 20px; color: #cfe4ff; margin-top: 6px; }

  .btn {
    font-family: inherit; font-size: 22px; font-weight: bold;
    padding: 12px 24px; margin: 6px;
    background: linear-gradient(#4fc3f7, #1e88e5);
    color: #fff; border: 3px solid #fff; border-radius: 12px;
    cursor: pointer; text-shadow: 2px 2px 0 rgba(0,0,0,.35);
    transition: transform .08s;
  }
  .btn:hover { transform: scale(1.06); }
  .btn:active { transform: scale(0.96); }
  .btn.big { font-size: 30px; padding: 16px 40px; }
  .btn.green { background: linear-gradient(#7ed957, #3aa832); }
  .btn.red { background: linear-gradient(#ff7b6b, #d63a2a); }

  /* ---------- choice cards ---------- */
  .cards { display: flex; gap: 18px; justify-content: center; margin-top: 10px; }
  .card {
    width: 126px; padding: 8px; cursor: pointer;
    background: #1b1b34; border: 4px solid #555a80; border-radius: 14px;
    transition: transform .1s, border-color .1s;
  }
  .card:hover { transform: translateY(-6px); border-color: #ffd54a; }
  .card.sel { border-color: #7ed957; background: #14301c; }
  .card canvas { width: 100px; height: 100px; margin: 0 auto; display: block; }
  .card .lbl { font-size: 19px; font-weight: bold; margin-top: 4px; }

  input[type=text] {
    font-family: inherit; font-size: 26px; text-align: center;
    padding: 10px; width: 320px; border-radius: 10px;
    border: 4px solid #ffd54a; background: #101024; color: #fff;
  }

  /* ---------- dialogue ---------- */
  /* flush to the bottom edge so no background peeks out beneath it */
  #dlg {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(8,8,20,0.94);
    border: 5px solid #fff; border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding: 12px 22px 14px;
  }
  #dlg .who { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
  #dlg .txt { font-size: 27px; line-height: 1.25; }
  #dlg .hint { font-size: 15px; color: #9fb0d0; margin-top: 8px; }

  /* ---------- wires / parts ---------- */
  .grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 12px; }
  .thing {
    width: 110px; height: 110px; border-radius: 14px; cursor: pointer;
    border: 4px solid #fff; background: #1b1b34;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  .thing:hover { transform: scale(1.08); }
  .thing.done { opacity: .3; pointer-events: none; }

  .toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 30px; font-weight: bold; padding: 8px 24px;
    background: rgba(0,0,0,.65); border-radius: 12px;
  }
  .center-col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv" width="900" height="540"></canvas>
    <div id="ui"></div>
  </div>
</div>

<script>
/* =========================================================================
   THE BOMB ADVENTURE
   A game designed by a 6-year-old. Built exactly to spec.
   ========================================================================= */

const cv  = document.getElementById('cv');
let   ctx = cv.getContext('2d');          // `let` on purpose: ctxSwap() retargets it
const MAIN_CTX = ctx;
const ui  = document.getElementById('ui');
const W = 900, H = 540, GROUND = 452;
const DLG_LIFT = 120;          // how far dialogue scenes shift up, clear of the text box

/* ------------------------------ game state ----------------------------- */
const S = {
  name: 'HERO',
  gender: 'boy',      // 'boy' | 'girl'
  weapon: 'axe',      // 'axe' | 'spear'
  level: 1,           // 1 = the bomb, 2 = the NASA spacecraft
  hp: 100, maxHp: 100,
  kills: 0,
  supplies: 0,
  bombsDefused: 0,
  loot: 0,
  // level 2
  beamsDodged: 0,
  partsFound: 0,
  shipHits: 0,
  shotsFired: 0,
  ragePct: 0,
  shake: 0,
  flash: 0
};

const COLORS = {
  boy:  { shirt: '#3c8ce7', pants: '#2b3a67', hair: '#5a3a1e', skin: '#f3c090' },
  girl: { shirt: '#e75fa8', pants: '#5a2f6b', hair: '#8a4a1e', skin: '#f6cba0' }
};

/* -------------------------------- input -------------------------------- */
const keys = {};
/* A fast tap can start and end between two animation frames, so the jump would
   silently never happen. Buffer it for a moment instead. */
let jumpBuffer = 0;
addEventListener('keydown', e => {
  if (!e.repeat && (e.code === 'ArrowUp' || e.code === 'KeyW')) jumpBuffer = 0.16;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* -------------------------------- audio -------------------------------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return actx;
}
function beep(freq, dur = 0.09, type = 'square', vol = 0.13) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function boomSound() {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * 0.6, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = 0.35;
  src.connect(g); g.connect(a.destination); src.start();
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.12), i * 130)); }

/* ------------------------------ ui helpers ----------------------------- */
function clearUI() { ui.innerHTML = ''; }
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function button(label, cls, fn) {
  const b = el('button', 'btn ' + (cls || ''), label);
  b.onclick = () => { beep(660); fn(); };
  return b;
}

/* ======================================================================== */
/*                              ART / DRAWING                                */
/* ======================================================================== */

function rr(x, y, w, h, r, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function circle(x, y, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

/* -- weapons (also used for the little choice-card previews) -- */
function drawWeapon(c, kind, scale) {
  c.save(); c.scale(scale, scale);
  if (kind === 'axe') {
    c.fillStyle = '#8a5a2b'; c.fillRect(-3, -40, 6, 68);          // handle
    c.fillStyle = '#6b4522'; c.fillRect(-3, -8, 6, 20);           // grip wrap
    // single-bit head with a curved cutting edge, so it reads as an axe
    c.fillStyle = '#c9d4e0';
    c.beginPath();
    c.moveTo(-2, -44); c.lineTo(16, -42);
    c.quadraticCurveTo(34, -30, 16, -12);
    c.lineTo(-2, -14);
    c.closePath(); c.fill();
    c.fillStyle = '#9aa8b8';                                      // butt of the head
    c.beginPath();
    c.moveTo(-2, -44); c.lineTo(-14, -40); c.lineTo(-14, -16); c.lineTo(-2, -14);
    c.closePath(); c.fill();
    c.fillStyle = '#eef4fa';                                      // edge highlight
    c.beginPath();
    c.moveTo(14, -41); c.quadraticCurveTo(31, -29, 14, -13);
    c.lineTo(19, -15); c.quadraticCurveTo(35, -29, 19, -39);
    c.closePath(); c.fill();
  } else {
    c.fillStyle = '#a5713c'; c.fillRect(-3, -46, 6, 86);          // shaft
    c.fillStyle = '#dbe6f0';                                      // tip
    c.beginPath();
    c.moveTo(0, -70); c.lineTo(11, -42); c.lineTo(0, -34); c.lineTo(-11, -42);
    c.closePath(); c.fill();
    c.fillStyle = '#c04b2a'; c.fillRect(-6, -32, 12, 6);          // wrap
  }
  c.restore();
}

/* -- the hero -- */
function drawHero(x, y, opt = {}) {
  const face  = opt.face  != null ? opt.face  : 1;
  const swing = opt.swing || 0;      // 0..1 attack animation
  const hurt  = opt.hurt  || false;
  const col   = COLORS[S.gender];
  const bob   = opt.bob ? Math.sin(opt.bob) * 2 : 0;

  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(face, 1);
  if (hurt) { ctx.globalAlpha = 0.55; }

  // shadow
  ctx.globalAlpha *= 0.35;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2 - bob, 24, 7, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = hurt ? 0.55 : 1;

  // legs
  rr(-13, -30, 10, 30, 4, col.pants);
  rr(3, -30, 10, 30, 4, col.pants);
  rr(-15, -4, 14, 8, 3, '#3a2a1a');
  rr(2, -4, 14, 8, 3, '#3a2a1a');

  // body
  rr(-17, -66, 34, 40, 8, col.shirt);
  // belt
  rr(-17, -34, 34, 7, 3, '#6b4a2a');

  // back arm
  rr(-22, -62, 10, 26, 5, col.skin);

  // head
  circle(0, -84, 18, col.skin);
  // hair
  ctx.fillStyle = col.hair;
  if (S.gender === 'girl') {
    ctx.beginPath(); ctx.arc(0, -86, 19, Math.PI, 0); ctx.fill();
    ctx.fillRect(-21, -88, 9, 34);
    ctx.fillRect(12, -88, 9, 34);
  } else {
    ctx.beginPath(); ctx.arc(0, -88, 18, Math.PI, 0); ctx.fill();
    ctx.fillRect(-18, -90, 36, 8);
  }
  // face
  circle(-6, -84, 2.6, '#241a12');
  circle(7, -84, 2.6, '#241a12');
  ctx.strokeStyle = '#241a12'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(1, -78, 6, 0.25, Math.PI - 0.25); ctx.stroke();

  // weapon arm (swings)
  ctx.save();
  ctx.translate(19, -56);
  ctx.rotate(-0.15 + swing * 2.2);
  rr(-5, -6, 11, 26, 5, col.skin);
  // held out clear of the torso, and small enough not to read as a shield
  ctx.translate(14, 30);
  drawWeapon(ctx, S.weapon, 0.62);
  ctx.restore();

  ctx.restore();
}

/* -- animals -- */
function drawAnimal(a) {
  const x = a.x, y = a.y, f = a.face;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(f, 1);
  if (a.hurtT > 0) ctx.globalAlpha = 0.5;

  ctx.globalAlpha *= 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2, a.r * 1.1, 7, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = a.hurtT > 0 ? 0.5 : 1;

  const wobble = Math.sin(a.t * 10) * 3;

  if (a.type === 'wolf') {
    rr(-30, -46, 60, 32, 12, '#7d8794');            // body
    rr(-34, -18, 10, 18, 4, '#5f6874');             // legs
    rr(18, -18, 10, 18, 4, '#5f6874');
    rr(-38, -16 + wobble, 12, 16, 5, '#6c7682');
    rr(24, -16 - wobble, 12, 16, 5, '#6c7682');
    rr(22, -62, 30, 26, 10, '#8b95a2');             // head
    ctx.fillStyle = '#8b95a2';                      // ears
    ctx.beginPath(); ctx.moveTo(26, -62); ctx.lineTo(30, -78); ctx.lineTo(38, -62); ctx.fill();
    ctx.beginPath(); ctx.moveTo(42, -62); ctx.lineTo(48, -78); ctx.lineTo(52, -62); ctx.fill();
    rr(46, -50, 14, 10, 4, '#5f6874');              // snout
    circle(34, -52, 3, '#ff3b30'); circle(46, -52, 3, '#ff3b30');
    ctx.fillStyle = '#fff';                          // teeth
    for (let i = 0; i < 3; i++) { ctx.fillRect(48 + i * 4, -42, 3, 5); }
    rr(-42, -44, 16, 8, 4, '#6c7682');               // tail
  }
  else if (a.type === 'boar') {
    rr(-34, -48, 66, 36, 14, '#6b4a33');
    rr(-30, -16, 11, 16, 4, '#4f3626');
    rr(16, -16, 11, 16, 4, '#4f3626');
    rr(24, -56, 30, 30, 12, '#7a563c');
    rr(48, -42, 14, 12, 5, '#b07a55');
    circle(34, -46, 3, '#2a1a10'); circle(46, -46, 3, '#2a1a10');
    ctx.fillStyle = '#f2ead2';                       // tusks
    ctx.beginPath(); ctx.moveTo(50, -32); ctx.lineTo(62, -40); ctx.lineTo(52, -26); ctx.fill();
    ctx.fillStyle = '#4a3122';                       // mane
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.moveTo(-20 + i * 9, -48); ctx.lineTo(-16 + i * 9, -62); ctx.lineTo(-12 + i * 9, -48); ctx.fill();
    }
  }
  else { // bear
    rr(-38, -62, 76, 54, 18, '#5a3d2b');
    rr(-30, -14, 14, 16, 5, '#432c1e');
    rr(16, -14, 14, 16, 5, '#432c1e');
    rr(20, -84, 36, 34, 14, '#6b4a34');
    circle(24, -88, 9, '#6b4a34'); circle(52, -88, 9, '#6b4a34');
    rr(46, -68, 16, 14, 6, '#8a6446');
    circle(30, -72, 3.5, '#1c1108'); circle(44, -72, 3.5, '#1c1108');
    circle(56, -62, 4, '#241408');
    ctx.fillStyle = '#fff';
    ctx.fillRect(48, -56, 4, 6); ctx.fillRect(55, -56, 4, 6);
  }
  ctx.restore();

  // health pip
  if (a.hp < a.maxHp) {
    const bw = a.r * 2;
    ctx.fillStyle = '#000a'; ctx.fillRect(x - bw / 2, y - a.h - 16, bw, 8);
    ctx.fillStyle = '#ff5a4a'; ctx.fillRect(x - bw / 2 + 1, y - a.h - 15, (bw - 2) * (a.hp / a.maxHp), 6);
  }
}

/* -- the friend -- */
function drawFriend(x, y, opt = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(opt.face || 1, 1);
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2, 22, 6, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  rr(-12, -28, 9, 28, 4, '#31405e'); rr(3, -28, 9, 28, 4, '#31405e');
  rr(-16, -62, 32, 38, 8, '#4fc98a');
  rr(-21, -58, 9, 24, 4, '#e8b98c');
  rr(12, -58, 9, 24, 4, '#e8b98c');
  circle(0, -80, 17, '#e8b98c');
  ctx.fillStyle = '#2c2118';
  ctx.beginPath(); ctx.arc(0, -83, 17, Math.PI, 0); ctx.fill();
  circle(-6, -80, 2.5, '#241a12'); circle(6, -80, 2.5, '#241a12');
  ctx.strokeStyle = '#241a12'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -74, 5, 0.2, Math.PI - 0.2); ctx.stroke();
  if (opt.pan) { // frying pan
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath(); ctx.arc(26, -66, 13, 0, 7); ctx.fill();
    ctx.fillRect(16, -70, 18, 5);
  }
  ctx.restore();
}

/* -- Bart -- */
function drawBart(x, y, angry) {
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2, 20, 6, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  rr(-11, -24, 8, 24, 3, '#3b6fd4'); rr(3, -24, 8, 24, 3, '#3b6fd4');
  rr(-16, -26, 12, 6, 3, '#2a2a2a'); rr(4, -26, 12, 6, 3, '#2a2a2a');
  rr(-15, -54, 30, 30, 6, '#ff7a2f');                 // shirt
  rr(-22, -52, 9, 22, 4, '#ffd21e');                  // arms out (strangling!)
  rr(13, -52, 9, 22, 4, '#ffd21e');
  circle(0, -70, 16, '#ffd21e');                      // head
  ctx.fillStyle = '#ffd21e';                          // spiky hair
  for (let i = 0; i < 8; i++) {
    const a0 = Math.PI + i * (Math.PI / 7.5);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0) * 15, -70 + Math.sin(a0) * 15);
    ctx.lineTo(Math.cos(a0 + 0.1) * 26, -70 + Math.sin(a0 + 0.1) * 26);
    ctx.lineTo(Math.cos(a0 + 0.22) * 15, -70 + Math.sin(a0 + 0.22) * 15);
    ctx.fill();
  }
  circle(-6, -72, 6, '#fff'); circle(6, -72, 6, '#fff');
  circle(-5, -72, 2.6, '#111'); circle(7, -72, 2.6, '#111');
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5;
  if (angry) {
    ctx.beginPath(); ctx.moveTo(-12, -80); ctx.lineTo(-2, -76); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -80); ctx.lineTo(2, -76); ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(0, -60, 8, 5, 0, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, -62, 6, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.restore();
}

/* -- Mario -- */
function drawMario(m) {
  ctx.save(); ctx.translate(m.x, m.y); ctx.scale(m.face, 1);
  if (m.hurtT > 0) ctx.globalAlpha = 0.5;
  ctx.globalAlpha *= 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2, 26, 7, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = m.hurtT > 0 ? 0.5 : 1;

  rr(-16, -34, 13, 34, 5, '#2a5fd0');                 // legs / overalls
  rr(3, -34, 13, 34, 5, '#2a5fd0');
  rr(-20, -6, 18, 8, 3, '#5a3a1e');                   // shoes
  rr(2, -6, 18, 8, 3, '#5a3a1e');
  rr(-20, -74, 40, 44, 9, '#e33b2e');                 // shirt
  rr(-14, -58, 28, 28, 6, '#2a5fd0');                 // overalls front
  circle(-8, -56, 3.5, '#ffd54a'); circle(8, -56, 3.5, '#ffd54a');
  rr(-28, -70, 11, 26, 5, '#e33b2e');                 // arms
  rr(18, -70, 11, 26, 5, '#e33b2e');
  circle(-24, -44, 8, '#fff'); circle(24, -44, 8, '#fff');   // gloves
  circle(0, -92, 19, '#f6c89a');                      // head
  ctx.fillStyle = '#e33b2e';                          // cap
  ctx.beginPath(); ctx.arc(0, -96, 19, Math.PI, 0); ctx.fill();
  ctx.fillRect(0, -98, 26, 8);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-1, -100, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#e33b2e'; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('M', -5, -96);
  circle(-6, -92, 3, '#2a1a10'); circle(7, -92, 3, '#2a1a10');
  ctx.fillStyle = '#f6c89a'; ctx.beginPath(); ctx.arc(4, -86, 6, 0, 7); ctx.fill();  // nose
  ctx.fillStyle = '#4a2f18';                          // moustache
  ctx.beginPath(); ctx.ellipse(0, -80, 15, 6, 0, 0, 7); ctx.fill();
  ctx.restore();
}

/* ------------------------- LEVEL 2 ART ------------------------- */

/* the NASA spacecraft — a chunky shuttle-ish thing that reads at any size */
function drawSpacecraft(x, y, s, t, opt = {}) {
  const fx = opt.face === -1 ? -1 : 1;      // nose points the way it's flying
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.scale(fx, 1);
  if (opt.tilt) ctx.rotate(opt.tilt);
  if (opt.hurtT > 0) ctx.globalAlpha = 0.55;

  // engine flames
  const flick = 0.7 + Math.abs(Math.sin(t * 22)) * 0.5;
  ctx.fillStyle = '#ff8a1f';
  ctx.beginPath(); ctx.moveTo(-74, -8); ctx.lineTo(-74 - 42 * flick, 0); ctx.lineTo(-74, 8); ctx.fill();
  ctx.fillStyle = '#ffe14a';
  ctx.beginPath(); ctx.moveTo(-74, -4); ctx.lineTo(-74 - 24 * flick, 0); ctx.lineTo(-74, 4); ctx.fill();

  // wings
  ctx.fillStyle = '#c8d2dd';
  ctx.beginPath(); ctx.moveTo(-20, 6); ctx.lineTo(-64, 42); ctx.lineTo(14, 20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-64, -42); ctx.lineTo(14, -20); ctx.closePath(); ctx.fill();
  // tail fin
  ctx.fillStyle = '#aab6c4';
  ctx.beginPath(); ctx.moveTo(-58, -6); ctx.lineTo(-84, -40); ctx.lineTo(-46, -8); ctx.closePath(); ctx.fill();

  // fuselage
  ctx.fillStyle = '#f2f5f8';
  ctx.beginPath();
  ctx.moveTo(76, 0);
  ctx.quadraticCurveTo(60, -24, 10, -26);
  ctx.lineTo(-72, -20); ctx.quadraticCurveTo(-82, 0, -72, 20);
  ctx.lineTo(10, 26); ctx.quadraticCurveTo(60, 24, 76, 0);
  ctx.fill();

  // stripes + markings
  ctx.fillStyle = '#2b5fd0'; ctx.fillRect(-40, -6, 74, 8);
  ctx.fillStyle = '#e33b2e'; ctx.fillRect(-40, 2, 74, 5);
  ctx.save(); ctx.scale(fx, 1);             // un-mirror so NASA stays readable
  ctx.fillStyle = '#1b2b40'; ctx.font = 'bold 15px "Trebuchet MS"';
  ctx.fillText('NASA', -34, -10);
  ctx.restore();

  // cockpit
  ctx.fillStyle = '#1b2b40';
  ctx.beginPath(); ctx.ellipse(50, -6, 17, 10, -0.15, 0, 7); ctx.fill();
  ctx.fillStyle = '#6fd2ff';
  ctx.beginPath(); ctx.ellipse(52, -8, 12, 6, -0.15, 0, 7); ctx.fill();

  // blinking beacon
  circle(-30, -22, 5, Math.sin(t * 9) > 0 ? '#ff4d3d' : '#5a1a14');

  if (opt.hp != null && opt.hp < opt.maxHp) {

  }
}

/* slingshot: pull 0..1, angle in radians */
function drawSlingshot(x, y, pull, angle, hasAmmo) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 34); ctx.lineTo(0, -6); ctx.stroke();   // handle
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-17, -34); ctx.stroke(); // Y fork
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(17, -34); ctx.stroke();
  // rubber band, stretched back along the aim line
  const px = -Math.cos(angle) * pull * 34, py = Math.sin(angle) * pull * 34;
  ctx.strokeStyle = '#d4634f'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-17, -34); ctx.lineTo(px, py - 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(17, -34); ctx.lineTo(px, py - 18); ctx.stroke();
  if (hasAmmo) circle(px, py - 18, 8, '#6e6357');
  ctx.restore();
}

/* -- scenery -- */
function drawSky(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawGround(color, detail) {
  ctx.fillStyle = color; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = detail;
  for (let i = 0; i < 40; i++) {
    const x = (i * 97) % W, y = GROUND + 12 + ((i * 53) % 60);
    ctx.fillRect(x, y, 14, 4);
  }
}
function drawTrees() {
  for (let i = 0; i < 6; i++) {
    const x = 60 + i * 160, s = 0.8 + (i % 3) * 0.2;
    ctx.save(); ctx.translate(x, GROUND); ctx.scale(s, s);
    ctx.fillStyle = '#4a331f';
    ctx.fillRect(-9, -70, 18, 70);
    ctx.fillStyle = '#2f7a3c';
    circle(0, -90, 38, '#2f7a3c'); circle(-26, -72, 26, '#2f7a3c'); circle(26, -72, 26, '#357f42');
    ctx.restore();
  }
}
function drawMountains(c1, c2) {
  ctx.fillStyle = c1;
  for (let i = 0; i < 5; i++) {
    const x = i * 220 - 60, h = 150 + (i % 3) * 55;
    ctx.beginPath();
    ctx.moveTo(x, GROUND); ctx.lineTo(x + 130, GROUND - h); ctx.lineTo(x + 260, GROUND);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = c2;
  for (let i = 0; i < 4; i++) {
    const x = i * 260 + 60, h = 100 + (i % 2) * 40;
    ctx.beginPath();
    ctx.moveTo(x, GROUND); ctx.lineTo(x + 110, GROUND - h); ctx.lineTo(x + 220, GROUND);
    ctx.closePath(); ctx.fill();
  }
}

/* -- HUD -- */
function drawHUD(label) {

  rr(24, 42, w * pct, 16, 8, pct > 0.5 ? '#59d96a' : pct > 0.25 ? '#ffcc33' : '#ff4d3d');
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(24, 42, w, 16, 8); ctx.stroke();
  if (label) {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Trebuchet MS';
    ctx.textAlign = 'right'; ctx.fillText(label, W - 22, 42); ctx.textAlign = 'left';

/* -- particles -- */
let parts = [];
function burst(x, y, color, n = 14, spd = 240) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.5 + Math.random() * 0.5, color, r: 3 + Math.random() * 4 });
  }
}
function updateParts(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    circle(p.x, p.y, p.r, p.color);
  }
  ctx.globalAlpha = 1;
}

function floatText(x, y, text, color) {
  parts.push({ x, y, vx: 0, vy: -70, life: 1.0, color, r: 0, text });
}
function drawFloatText() {
  ctx.font = 'bold 26px Trebuchet MS'; ctx.textAlign = 'center';
  for (const p of parts) {
    if (!p.text) continue;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

/*                            SCENE MACHINERY                                */
/* ======================================================================== */

let scene = null;
function setScene(s) {
  if (scene && scene.cleanup) scene.cleanup();
  clearUI(); parts = [];
  scene = s;
  if (s.enter) s.enter();
}

let last = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  ctx.save();
  if (S.shake > 0) {
    ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    S.shake = Math.max(0, S.shake - dt * 40);
  }
  if (scene) {
    if (scene.update) scene.update(dt);
    if (scene.draw) scene.draw();
  }
  updateParts(dt); drawParts(); drawFloatText();
  ctx.restore();

  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, S.flash)})`;
    ctx.fillRect(0, 0, W, H);
    S.flash -= dt * 2.2;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* A panel pinned to the bottom of the screen (dialogue box, choice buttons)
   would otherwise sit right on top of the characters, so shift the scene up. */
function drawLifted(fn) {
  ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, -DLG_LIFT);
  fn();
  ctx.restore();
}

/* ---- generic dialogue scene ---- */
function dialogue(lines, bgFn, nextFn) {
  let i = 0;
  const box = el('div'); box.id = 'dlg';
  const who = el('div', 'who'), txt = el('div', 'txt'), hint = el('div', 'hint', 'click to continue  ▶');

  function show() {
    const L = lines[i];
    who.textContent = L.who || '';
    who.style.color = L.color || '#ffd54a';
    txt.textContent = L.text;
    beep(500 + (i % 3) * 90, 0.05, 'triangle', 0.07);
  }
  function next() {
    i++;
    if (i >= lines.length) { clearUI(); nextFn(); }
    else show();
  }

  const onKey = e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); next(); }
  };

  setScene({
    enter() {
      const overlay = el('div');
      overlay.style.cssText = 'position:absolute;inset:0;cursor:pointer';
      overlay.onclick = next;
      ui.appendChild(overlay);

      box.appendChild(who); box.appendChild(txt); box.appendChild(hint);
      box.style.cursor = 'pointer';
      box.onclick = next;                 // the box sits on top of the overlay
      ui.appendChild(box);

      show();
      addEventListener('keydown', onKey);
    },
    cleanup() { removeEventListener('keydown', onKey); },
    draw() { drawLifted(bgFn); },
    update(dt) { if (this.t == null) this.t = 0; this.t += dt; }
  });
}

/* The drawing helpers all talk to the module-level `ctx`. ctxSwap() points it at
   a different canvas so the same art code can render the little preview cards. */
function ctxSwap(newCtx) { ctx = newCtx; }

function drawHeroOn(g, gender, x, y, scale) {
  ctxSwap(g);
  const saved = S.gender; S.gender = gender;
  g.save(); g.translate(x, y); g.scale(scale, scale);
  drawHero(0, 0, { face: 1 });
  g.restore();
  S.gender = saved;
  ctxSwap(MAIN_CTX);
}

function makeFighter() {
  return {
    x: 180, y: GROUND + 40, vx: 0, vy: 0, face: 1,
    onGround: true, swing: 0, cool: 0, invuln: 0, t: 0
  };

function fighterPhysics(p, dt) {
  const spd = 260;
  p.vx = 0;
  if (keys.ArrowLeft || keys.KeyA)  { p.vx = -spd; p.face = -1; }
  if (keys.ArrowRight || keys.KeyD) { p.vx =  spd; p.face =  1; }
  if (jumpBuffer > 0) jumpBuffer -= dt;
  if ((keys.ArrowUp || keys.KeyW || jumpBuffer > 0) && p.onGround) {
    p.vy = -560; p.onGround = false; jumpBuffer = 0;
    beep(700, 0.07, 'triangle', 0.08);
  }

  p.x += p.vx * dt;
  p.vy += 1500 * dt;
  p.y += p.vy * dt;
  if (p.y >= GROUND + 40) { p.y = GROUND + 40; p.vy = 0; p.onGround = true; }
  p.x = Math.max(40, Math.min(W - 40, p.x));

  p.t += dt;
  if (p.cool > 0) p.cool -= dt;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.swing > 0) p.swing = Math.max(0, p.swing - dt * 4);
}

/* Pickup test measured from the player's chest, so an item is grabbed whether
   you walk into it or jump through it — never "I touched it and nothing happened". */
function touching(it, p, r = 95) {
  const dx = it.x - p.x, dy = it.y - (p.y - 50);
  return dx * dx + dy * dy < r * r;
}

function tryAttack(p) {
  const st = WEAPON_STATS[S.weapon];
  if (p.cool > 0 || !keys.Space) return null;
  p.cool = st.cool; p.swing = 1;
  beep(S.weapon === 'axe' ? 180 : 320, 0.1, 'sawtooth', 0.11);
  return { x: p.x + p.face * (st.reach * 0.6), y: p.y - 45, r: st.reach * 0.6, dmg: st.dmg };
}

function hurtPlayer(amount, fromX) {
  if (scene.pInvulnRef && scene.pInvulnRef.invuln > 0) return;
  S.hp -= amount;
  S.shake = 14; boomSound();
  if (scene.pInvulnRef) scene.pInvulnRef.invuln = 0.9;
  floatText(scene.pInvulnRef ? scene.pInvulnRef.x : W / 2, GROUND - 40, '-' + amount, '#ff6b5a');
  burst(scene.pInvulnRef ? scene.pInvulnRef.x : W / 2, GROUND - 20, '#ff6b5a', 10);
}

/* Tuned gentle on purpose — this is a 6-year-old's game, so animals hit softly
   and slowly, and the player out-damages them comfortably. */
const ANIMAL_DEFS = {
  wolf: { hp: 55,  spd: 120, dmg: 5, r: 40, h: 70, color: '#7d8794' },
  boar: { hp: 75,  spd: 100, dmg: 7, r: 44, h: 62, color: '#6b4a33' },
  bear: { hp: 110, spd: 82,  dmg: 9, r: 52, h: 92, color: '#5a3d2b' }
};

function sceneAnimals() {
  const p = makeFighter();
  const waves = ['wolf', 'wolf', 'boar', 'wolf', 'boar', 'bear'];
  let spawned = 0, animals = [], spawnT = 0.4, done = false, t = 0;
  S.kills = 0;

  function spawn() {
    const type = waves[spawned];
    const d = ANIMAL_DEFS[type];
    const fromLeft = Math.random() < 0.4;
    animals.push({
      type, x: fromLeft ? -60 : W + 60, y: GROUND + 40,
      face: fromLeft ? 1 : -1, hp: d.hp, maxHp: d.hp, spd: d.spd,
      dmg: d.dmg, r: d.r, h: d.h, hurtT: 0, atkCool: 0, t: 0
    });
    spawned++;
  }

  setScene({
    pInvulnRef: p,
    update(dt) {
      if (done) return;
      t += dt;
      fighterPhysics(p, dt);
      const hit = tryAttack(p);

      spawnT -= dt;
      if (spawnT <= 0 && spawned < waves.length && animals.length < 3) {
        spawn(); spawnT = 2.2;
      }

      for (const a of animals) {
        a.t += dt;
        if (a.hurtT > 0) a.hurtT -= dt;
        if (a.atkCool > 0) a.atkCool -= dt;
        const dx = p.x - a.x;
        a.face = dx > 0 ? 1 : -1;
        if (Math.abs(dx) > 46) a.x += Math.sign(dx) * a.spd * dt;
        else if (a.atkCool <= 0 && Math.abs(p.y - a.y) < 60) {
          a.atkCool = 1.5;
          hurtPlayer(a.dmg);
        }
        if (hit && Math.abs(hit.x - a.x) < hit.r + a.r * 0.7 && Math.abs(hit.y - (a.y - a.h / 2)) < 70) {
          if (a.hurtT <= 0) {
            a.hp -= hit.dmg; a.hurtT = 0.22;
            burst(a.x, a.y - a.h / 2, '#ffd54a', 10);
            floatText(a.x, a.y - a.h - 20, '-' + hit.dmg, '#ffd54a');
            beep(140, 0.08, 'square', 0.12);
            a.x += a.face * -18;
          }
        }
      }

      const before = animals.length;
      animals = animals.filter(a => {
        if (a.hp <= 0) {
          burst(a.x, a.y - a.h / 2, ANIMAL_DEFS[a.type].color, 22, 320);
          S.kills++; beep(880, 0.12, 'square', 0.1);
          return false;
        }
        return true;
      });

      if (S.hp <= 0) { done = true; setTimeout(() => gameOver(sceneAnimals), 400); }
      if (spawned >= waves.length && animals.length === 0) {
        done = true;
        S.hp = Math.min(S.maxHp, S.hp + 30);
        setTimeout(sceneBombDrop, 900);
      }
    },
    draw() {
      drawSky('#0e2038', '#3f6f4a');
      drawMountains('#14283f', '#1b3550');
      drawGround('#3a5a34', '#456b3e');
      drawTrees();
      for (const a of animals) drawAnimal(a);
      drawHero(p.x, p.y, { face: p.face, swing: 1 - p.swing, hurt: p.invuln > 0, bob: p.vx !== 0 ? p.t * 12 : 0 });
      drawHUD('ANIMALS BEATEN: ' + S.kills + ' / ' + waves.length);
      if (t < 3) {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Trebuchet MS'; ctx.textAlign = 'center';
        ctx.fillText('SPACE to swing your ' + WEAPON_STATS[S.weapon].name + '!', W / 2, 120);
        ctx.textAlign = 'left';
      }
    }
  });
}

function drawApocalypse(t) {

];

function sceneShelter() {
  const p = makeFighter();
  p.x = 100;
  const need = 6;
  let items = [], collected = 0, timeLeft = 45, done = false;

  const picks = [...SUPPLY_KINDS].sort(() => Math.random() - 0.5).slice(0, need);
  // odd items sit up on the shelf (reachable with a jump), even ones on the floor
  picks.forEach((k, i) => {
    items.push({
      kind: k,
      x: 170 + i * 118 + (Math.random() * 40 - 20),
      y: (i % 2) ? GROUND - 122 : GROUND + 6,
      got: false, t: Math.random() * 6
    });
  });

  setScene({
    pInvulnRef: p,
    enter() {
      const tip = el('div', 'toast', 'GRAB THE SUPPLIES!');
      ui.appendChild(tip);
      setTimeout(() => tip.remove(), 2600);
    },
    update(dt) {
      if (done) return;
      fighterPhysics(p, dt);
      timeLeft -= dt;
      for (const it of items) {
        it.t += dt;
        if (it.got) continue;
        if (touching(it, p)) {
          it.got = true; collected++; S.supplies++;
          beep(700 + collected * 90, 0.13, 'square', 0.12);
          burst(it.x, it.y, '#ffd54a', 14);
          floatText(it.x, it.y - 30, it.kind.n + '!', '#9fe870');
        }
      }
      if (collected >= need) {
        done = true; fanfare();
        setTimeout(sceneFriend, 1100);
      } else if (timeLeft <= 0) {
        // no punishment — the shelter door just opens anyway
        done = true;
        setTimeout(sceneFriend, 600);
      }
    },
    draw() {
      // shelter interior
      drawSky('#1b1a26', '#33303f');
      ctx.fillStyle = '#2a2733'; ctx.fillRect(0, 0, W, GROUND);
      // wall panels
      ctx.strokeStyle = '#3d3a4a'; ctx.lineWidth = 4;
      for (let x = 0; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); ctx.stroke(); }
      for (let y = 60; y < GROUND; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      // shelves
      ctx.fillStyle = '#4a4358';
      ctx.fillRect(140, GROUND - 100, 640, 10);
      ctx.fillRect(140, GROUND - 100, 10, 100);
      ctx.fillRect(770, GROUND - 100, 10, 100);
      // hanging lamp
      ctx.strokeStyle = '#666'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, 60); ctx.stroke();
      ctx.fillStyle = 'rgba(255,220,140,.18)';
      ctx.beginPath(); ctx.moveTo(W / 2, 70); ctx.lineTo(W / 2 - 220, GROUND); ctx.lineTo(W / 2 + 220, GROUND); ctx.fill();
      circle(W / 2, 66, 16, '#ffe9a8');
      drawGround('#3b3746', '#46414f');

      for (const it of items) {
        if (it.got) continue;
        const fy = it.y + Math.sin(it.t * 3) * 5;
        ctx.save();
        ctx.translate(it.x, fy);
        ctx.globalAlpha = 0.3; ctx.fillStyle = '#ffd54a';
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        it.kind.draw(ctx);
        ctx.restore();
        // name it — the icons alone are a guessing game
        const ly = it.y < GROUND - 60 ? fy - 40 : fy + 46;
        ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        ctx.strokeText(it.kind.n, it.x, ly);
        ctx.fillStyle = '#ffe9a8'; ctx.fillText(it.kind.n, it.x, ly);
        ctx.textAlign = 'left';
      }
      drawHero(p.x, p.y, { face: p.face, bob: p.vx !== 0 ? p.t * 12 : 0 });
      drawHUD('SUPPLIES: ' + collected + ' / ' + need);
      ctx.fillStyle = timeLeft < 10 ? '#ff6b5a' : '#fff';
      ctx.font = 'bold 26px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('TIME: ' + Math.max(0, Math.ceil(timeLeft)), W / 2, 40);
      ctx.textAlign = 'left';
    }
  });
}

  { name: 'RED',    hex: '#ff4d3d' },
  { name: 'GREEN',  hex: '#4ede77' },
  { name: 'BLUE',   hex: '#4fa3ff' },

function drawBombRoom(t, timeLeft) {
  drawSky('#160d1c', '#3a1a22');
  ctx.fillStyle = '#241522'; ctx.fillRect(0, 0, W, H);
  const pulse = 0.5 + Math.sin(t * 6) * 0.5;
  ctx.fillStyle = `rgba(255,60,40,${0.06 + pulse * 0.09})`;
  ctx.fillRect(0, 0, W, H);
  // bomb crate — kept above y=300 so the wire panel never covers the timer
  rr(W / 2 - 200, 76, 400, 210, 18, '#3a2f3c');
  rr(W / 2 - 186, 90, 372, 182, 14, '#4a3d4d');
  // display
  rr(W / 2 - 115, 112, 230, 70, 10, '#0b0f0b');
  ctx.fillStyle = timeLeft < 6 ? '#ff4d3d' : '#4ede77';
  ctx.font = 'bold 54px "Courier New", monospace'; ctx.textAlign = 'center';
  const secs = Math.max(0, Math.ceil(timeLeft));
  ctx.fillText(('0' + Math.floor(secs / 60)).slice(-2) + ':' + ('0' + (secs % 60)).slice(-2), W / 2, 166);
  ctx.textAlign = 'left';
  // blinky light
  circle(W / 2 + 152, 134, 12, pulse > 0.5 ? '#ff4d3d' : '#5a1a14');
  // bolts
  [[-180, 96], [180, 96], [-180, 266], [180, 266]].forEach(([dx, dy]) => circle(W / 2 + dx, dy, 7, '#6b5a6e'));
  // wires running out of the bomb toward the panel below
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ['#ff4d3d', '#4ede77', '#4fa3ff', '#ffd54a'].forEach((c, i) => {
    ctx.strokeStyle = c;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 90 + i * 60, 286);
    ctx.quadraticCurveTo(W / 2 - 90 + i * 60 + Math.sin(t * 2 + i) * 18, 320, W / 2 - 120 + i * 80, 350);
    ctx.stroke();
  });
}

function sceneDefuse(round) {
  const total = 3;
  const nWires = 3 + round;                                     // 4, 5, 6
  const pool = [...WIRE_COLORS].sort(() => Math.random() - 0.5).slice(0, nWires);
  const target = pool[Math.floor(Math.random() * pool.length)];
  let timeLeft = 26 - round * 2;          // 24s / 22s / 20s
  let t = 0, over = false;
  window.__wireNames = pool.map(w => w.name);   // playtest hook

  setScene({
    enter() {
      const p = el('div', 'panel');
      p.style.bottom = '4%'; p.style.top = 'auto'; p.style.width = '88%';
      p.appendChild(el('div', '', `<div style="font-size:26px;font-weight:bold">BOMB ${round} of ${total} — CUT THE <span style="color:${target.hex}">${target.name}</span> WIRE!</div>`));
      const grid = el('div', 'grid');
      pool.forEach(w => {
        const d = el('div', 'thing');
        d.style.background = '#141420';
        const c = document.createElement('canvas'); c.width = 100; c.height = 100;
        const g = c.getContext('2d');
        g.strokeStyle = w.hex; g.lineWidth = 14; g.lineCap = 'round';
        g.beginPath(); g.moveTo(12, 20); g.bezierCurveTo(40, 70, 60, 20, 88, 70); g.stroke();
        g.fillStyle = '#8892a0'; g.fillRect(6, 76, 88, 16);
        c.style.width = '100px'; c.style.height = '100px';
        d.appendChild(c);
        d.onclick = () => cut(w, d);
        grid.appendChild(d);
      });
      p.appendChild(grid);
      ui.appendChild(p);
    },
    update(dt) {
      if (over) return;
      t += dt; timeLeft -= dt;
      if (timeLeft <= 5 && Math.floor(timeLeft * 2) !== Math.floor((timeLeft + dt) * 2)) beep(880, 0.06, 'square', 0.1);
      if (timeLeft <= 0) { over = true; fail(); }
    },
    draw() { drawBombRoom(t, timeLeft); drawHUD('BOMB ' + round + ' / ' + total); }
  });

  function cut(w, node) {
    if (over) return;
    if (w.name === target.name) {
      over = true;
      node.classList.add('done');
      fanfare(); S.bombsDefused++;
      burst(W / 2, 260, '#4ede77', 30, 300);
      clearUI();
      const msg = el('div', 'toast', '✂ DEFUSED!'); msg.style.color = '#4ede77';
      ui.appendChild(msg);
      setTimeout(() => {
        if (round < total) sceneDefuse(round + 1);
        else sceneBuildBomb();
      }, 1400);
    } else {
      beep(90, 0.25, 'sawtooth', 0.14);
      node.classList.add('done');
      timeLeft = Math.max(3, timeLeft - 4);
      S.shake = 16;
      floatText(W / 2, 300, 'WRONG WIRE!', '#ff5a4a');
    }
  }

  function fail() {

/* Each part knows where it mounts on the finished bomb (mx,my,ms), so the
   assembly builds a consistent silhouette no matter what order it's clicked. */
const BOMB_PARTS = [
  { n: 'SHELL',  mx: 0, my: 0,   ms: 1,
    draw: g => { rr(-26, -30, 52, 62, 20, '#3d4450'); rr(-8, -42, 16, 14, 4, '#5a6270'); } },
  { n: 'POWDER', mx: 0, my: 8,   ms: 0.6,
    draw: g => { rr(-24, -14, 48, 40, 8, '#8a6a2a'); ctx.fillStyle = '#c9922f'; ctx.beginPath(); ctx.moveTo(-18, -14); ctx.lineTo(0, -36); ctx.lineTo(18, -14); ctx.fill(); } },
  { n: 'TIMER',  mx: 0, my: -4,  ms: 0.62,
    draw: g => { rr(-26, -20, 52, 40, 6, '#1a2a1a'); ctx.fillStyle = '#4ede77'; ctx.font = 'bold 20px monospace'; ctx.fillText('0:10', -22, 6); } },
  { n: 'WIRES',  mx: 32, my: -18, ms: 0.7,
    draw: g => { ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = '#ff4d3d'; ctx.beginPath(); ctx.moveTo(-24, 8); ctx.bezierCurveTo(-8, -26, 8, 24, 24, -12); ctx.stroke(); ctx.strokeStyle = '#4fa3ff'; ctx.beginPath(); ctx.moveTo(-24, 20); ctx.bezierCurveTo(-6, -8, 10, 30, 24, 4); ctx.stroke(); } },
  { n: 'BUTTON', mx: 0, my: -52, ms: 0.62,
    draw: g => { circle(0, 4, 24, '#5a1a22'); circle(0, 0, 20, '#ff2d55'); circle(-6, -6, 6, '#ff8a9c'); } }
];

function sceneBuildBomb() {
  const order = [...BOMB_PARTS].sort(() => Math.random() - 0.5);
  let step = 0, t = 0, done = false;
  window.__partOrder = order.map(o => o.n);      // playtest hooks
  window.__partStep = () => step;

  setScene({
    enter() {
      const top = el('div', 'panel');
      top.style.top = '3%'; top.style.width = '90%';
      top.appendChild(el('div', '', '<div style="font-size:26px;font-weight:bold;color:#ffd54a">NOW BUILD YOUR OWN BOMB!</div>'));
      const seq = el('div', 'sub', '');
      seq.id = 'seq';
      top.appendChild(seq);
      ui.appendChild(top);

      const p = el('div', 'panel');
      p.style.bottom = '4%'; p.style.top = 'auto'; p.style.width = '92%';
      p.appendChild(el('div', 'sub', 'Click the parts in the right order!'));
      const grid = el('div', 'grid');
      const shuffled = [...order].sort(() => Math.random() - 0.5);
      shuffled.forEach(part => {
        const d = el('div', 'thing');
        const c = document.createElement('canvas'); c.width = 100; c.height = 100;
        const g = c.getContext('2d');
        ctxSwap(g);
        g.save(); g.translate(50, 55); part.draw(g); g.restore();
        ctxSwap(MAIN_CTX);
        c.style.width = '100px'; c.style.height = '100px';
        d.appendChild(c);
        d.title = part.n;
        d.onclick = () => pick(part, d);
        grid.appendChild(d);
      });
      p.appendChild(grid);
      ui.appendChild(p);
      updateSeq();

      function updateSeq() {
        seq.innerHTML = order.map((o, i) =>
          `<span style="color:${i < step ? '#4ede77' : i === step ? '#ffd54a' : '#7a819a'};font-weight:bold">${i + 1}. ${o.n}</span>`
        ).join('&nbsp; → &nbsp;');
      }
      this.updateSeq = updateSeq;

      function pick(part, node) {
        if (done) return;
        if (part.n === order[step].n) {
          step++; node.classList.add('done');
          beep(500 + step * 120, 0.12, 'square', 0.12);
          burst(W / 2, 300, '#4ede77', 12);
          updateSeq();
          if (step >= order.length) {
            done = true; fanfare();
            setTimeout(sceneLoot, 1300);
          }
        } else {
          beep(110, 0.2, 'sawtooth', 0.13);
          S.shake = 12;
          floatText(W / 2, 300, 'NOT THAT ONE!', '#ff5a4a');
        }
      }
    },
    update(dt) { t += dt; },
    draw() {
      drawSky('#101828', '#2a1f38');
      ctx.fillStyle = '#1a1526'; ctx.fillRect(0, 0, W, H);
      // workbench
      rr(W / 2 - 240, 300, 480, 24, 8, '#6b4a2e');
      rr(W / 2 - 220, 324, 30, 90, 6, '#553a24');
      rr(W / 2 + 190, 324, 30, 90, 6, '#553a24');
      // the bomb assembling itself as you go
      ctx.save(); ctx.translate(W / 2, 268); ctx.scale(1.35, 1.35);
      // draw in canonical order (not click order) so parts layer correctly
      for (const part of BOMB_PARTS) {
        if (order.indexOf(part) >= step) continue;
        ctx.save();
        ctx.translate(part.mx, part.my); ctx.scale(part.ms, part.ms);
        part.draw(ctx);
        ctx.restore();
      }
      ctx.restore();
      if (step === 0) {
        ctx.fillStyle = '#6b6480'; ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
        ctx.fillText('(empty workbench)', W / 2, 268); ctx.textAlign = 'left';
      }
      // no HP bar here — the instruction panel sits where the HUD would be
      ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('PARTS: ' + step + ' / ' + order.length, W / 2, 188);
      ctx.textAlign = 'left';
    }
  });
}

function sceneLoot() {
  let t = 0, opened = false, coins = [];
  setScene({
    enter() {
      const p = el('div', 'panel');
      p.style.bottom = '6%'; p.style.top = 'auto';
      p.appendChild(el('div', 'sub', 'Your bomb blew the vault open!'));
      p.appendChild(button('OPEN THE LOOT! 💰', 'big green', () => {
        if (opened) return;
        opened = true; fanfare(); boomSound(); S.flash = 0.9; S.shake = 20;
        for (let i = 0; i < 40; i++) {
          coins.push({
            x: W / 2, y: 300,
            vx: (Math.random() - 0.5) * 520, vy: -260 - Math.random() * 340,
            r: 9 + Math.random() * 7, spin: Math.random() * 6
          });
        }
        S.loot = 999;
        clearUI();
        setTimeout(() => {
          const q = el('div', 'panel'); q.style.bottom = '6%'; q.style.top = 'auto';
          q.appendChild(el('div', 'sub', 'YOU GOT ALL THE LOOT!'));

        if (c.y > GROUND + 30) { c.y = GROUND + 30; c.vy *= -0.4; c.vx *= 0.7; }
      }
    },
    draw() {
      drawSky('#1a1226', '#3b2a1a');
      ctx.fillStyle = '#241a2c'; ctx.fillRect(0, 0, W, H);
      drawGround('#463420', '#54402a');
      // vault
      rr(W / 2 - 150, 150, 300, 260, 16, opened ? '#4a3a2a' : '#54606e');
      if (!opened) {
        circle(W / 2, 280, 52, '#3d4450');
        circle(W / 2, 280, 40, '#6b7684');
        ctx.strokeStyle = '#2a3038'; ctx.lineWidth = 8;
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3 + t;
          ctx.beginPath(); ctx.moveTo(W / 2, 280);
          ctx.lineTo(W / 2 + Math.cos(a) * 50, 280 + Math.sin(a) * 50); ctx.stroke();
        }
      } else {
        rr(W / 2 - 130, 170, 260, 220, 10, '#160f08');
        // a heap of treasure inside, so the open vault isn't just a black hole
        ctx.save(); ctx.beginPath(); ctx.rect(W / 2 - 130, 170, 260, 220); ctx.clip();
        for (let i = 0; i < 34; i++) {
          const gx = W / 2 - 105 + ((i * 71) % 210);
          const gy = 388 - ((i * 37) % 90) - Math.sin(i) * 8;
          circle(gx, gy, 11, '#ffd54a'); circle(gx, gy, 7, '#f7b32b');

        ctx.fillStyle = 'rgba(255,213,74,.18)';
        ctx.beginPath(); ctx.ellipse(W / 2, 340, 130, 90, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      for (const c of coins) {
        ctx.save(); ctx.translate(c.x, c.y);
        ctx.scale(Math.abs(Math.cos(c.spin)) * 0.7 + 0.3, 1);
        circle(0, 0, c.r, '#ffd54a');
        circle(0, 0, c.r * 0.6, '#f7b32b');
        ctx.restore();
      }
      drawHero(180, GROUND + 40, { face: 1, bob: t * 3 });
      drawHUD(opened ? 'LOOT: ALL OF IT' : 'THE VAULT');
    }
  });
}

function scenePortal() {
  const p = makeFighter();
  p.x = 120;
  let t = 0, entering = false, warp = 0;
  const PX = 700;

  setScene({
    pInvulnRef: p,
    enter() {
      const tip = el('div', 'toast', 'WALK INTO THE PORTAL!  ← →');
      ui.appendChild(tip);
    },
    update(dt) {
      t += dt;
      if (!entering) {
        fighterPhysics(p, dt);
        if (Math.abs(p.x - PX) < 55) {
          entering = true; clearUI();
          beep(300, 0.4, 'sine', 0.12);
          setTimeout(() => beep(900, 0.5, 'sine', 0.12), 200);
        }
      } else {
        warp += dt;
        S.shake = 8;
        if (warp > 1.9) { S.shake = 0; S.flash = 1.6; sceneMarioIntro(); }
      }
    },
    draw() {
      drawSky('#2a0f0a', '#7a3520');
      drawMountains('#3a1c14', '#4a251a');
      drawGround('#4a2a18', '#5c3620');
      ctx.fillStyle = '#2a1a12';
      for (let i = 0; i < 6; i++) ctx.fillRect(60 + i * 160 - 8, GROUND - 44, 16, 44);

      // portal
      ctx.save(); ctx.translate(PX, GROUND - 90);
      for (let i = 6; i >= 0; i--) {
        const r = 100 - i * 12;
        const hue = (t * 120 + i * 40) % 360;
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = `hsl(${hue}, 90%, ${35 + i * 5}%)`;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.62, r, Math.sin(t + i) * 0.06, 0, 7);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 38, 0, 0, 7); ctx.fill();
      ctx.restore();

      if (Math.random() < 0.5) burst(PX + (Math.random() - 0.5) * 100, GROUND - 90, '#a86bff', 1, 80);

      if (!entering) {
        drawHero(p.x, p.y, { face: p.face, bob: p.vx !== 0 ? p.t * 12 : 0 });
      } else {
        const s = Math.max(0.05, 1 - warp / 1.9);
        ctx.save();
        ctx.translate(PX, GROUND + 40);
        ctx.scale(s, s);
        ctx.rotate(warp * 6);
        drawHero(0, 0, { face: 1 });
        ctx.restore();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 36px Trebuchet MS'; ctx.textAlign = 'center';
        ctx.fillText('WHOOOOAAAA!', W / 2, 90); ctx.textAlign = 'left';
      }
      drawHUD('FIND THE PORTAL');
    }
  });
}

function sceneMario() {
  const p = makeFighter();
  p.x = 160;
  S.hp = S.maxHp;                        // full heal before the boss

  const m = {
    x: 720, y: GROUND + 40, vx: -110, vy: 0, face: -1,
    hp: 160, maxHp: 160, hurtT: 0, fireT: 1.9, jumpT: 2.4, onGround: true, phase: 1
  };
  let fires = [], t = 0, done = false;

  setScene({
    pInvulnRef: p,
    update(dt) {
      if (done) return;
      t += dt;
      fighterPhysics(p, dt);
      const hit = tryAttack(p);

      /* --- mario AI --- */
      if (m.hurtT > 0) m.hurtT -= dt;
      m.phase = m.hp < m.maxHp * 0.5 ? 2 : 1;
      const speedUp = m.phase === 2 ? 1.5 : 1;

      m.x += m.vx * speedUp * dt;
      if (m.x < 90) { m.x = 90; m.vx = Math.abs(m.vx); }
      if (m.x > W - 90) { m.x = W - 90; m.vx = -Math.abs(m.vx); }
      m.face = p.x < m.x ? -1 : 1;

      m.vy += 1500 * dt; m.y += m.vy * dt;
      if (m.y >= GROUND + 40) { m.y = GROUND + 40; m.vy = 0; m.onGround = true; }

      m.jumpT -= dt;
      if (m.jumpT <= 0 && m.onGround) {
        m.vy = -640; m.onGround = false;
        m.jumpT = (m.phase === 2 ? 1.4 : 2.4) + Math.random();
        beep(520, 0.09, 'triangle', 0.08);
      }

      m.fireT -= dt;
      if (m.fireT <= 0) {
        m.fireT = (m.phase === 2 ? 1.1 : 1.7) + Math.random() * 0.5;
        fires.push({ x: m.x + m.face * 30, y: m.y - 60, vx: m.face * 300, vy: -120, r: 13, t: 0 });
        beep(240, 0.1, 'sawtooth', 0.09);
      }

      for (const f of fires) {
        f.t += dt;
        f.x += f.vx * dt; f.vy += 900 * dt; f.y += f.vy * dt;
        if (f.y > GROUND + 34) { f.y = GROUND + 34; f.vy = -420; }
        if (Math.abs(f.x - p.x) < f.r + 20 && Math.abs(f.y - (p.y - 45)) < f.r + 42) {
          if (p.invuln <= 0) { hurtPlayer(7); f.t = 99; }
        }
      }
      fires = fires.filter(f => f.t < 6 && f.x > -40 && f.x < W + 40);

      /* --- player hits mario --- */
      if (hit && m.hurtT <= 0 &&
          Math.abs(hit.x - m.x) < hit.r + 34 && Math.abs(hit.y - (m.y - 50)) < 80) {
        m.hp -= hit.dmg; m.hurtT = 0.28;
        burst(m.x, m.y - 60, '#ffd54a', 12);
        floatText(m.x, m.y - 120, '-' + hit.dmg, '#ffd54a');
        beep(150, 0.09, 'square', 0.12);
        m.x += -m.face * 22;
      }
      /* --- stomp --- */
      if (m.hurtT <= 0 && p.vy > 120 && Math.abs(p.x - m.x) < 46 && p.y < m.y - 40) {
        m.hp -= 26; m.hurtT = 0.4; p.vy = -520;
        burst(m.x, m.y - 90, '#fff', 16);
        floatText(m.x, m.y - 140, 'STOMP! -26', '#4ede77');
        beep(950, 0.12, 'square', 0.12);
      }
      /* --- mario touches you --- */
      if (Math.abs(p.x - m.x) < 42 && Math.abs(p.y - m.y) < 60 && p.invuln <= 0 && !(p.vy > 120)) {
        hurtPlayer(7);
      }

      if (S.hp <= 0) { done = true; setTimeout(() => gameOver(sceneMario), 400); }
      if (m.hp <= 0) {
        done = true;
        burst(m.x, m.y - 60, '#e33b2e', 40, 420);
        fanfare();
        setTimeout(sceneWin, 1400);
      }
    },
    draw() {
      marioBG(t);
      for (const f of fires) {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.t * 12);
        circle(0, 0, f.r, '#ff8a1f');
        circle(0, 0, f.r * 0.55, '#ffe14a');
        ctx.restore();
      }
      drawMario(m);
      drawHero(p.x, p.y, { face: p.face, swing: 1 - p.swing, hurt: p.invuln > 0, bob: p.vx !== 0 ? p.t * 12 : 0 });

      // boss bar — sits below the player HUD so the two never collide
      const bw = 420, by = 80;
      rr(W / 2 - bw / 2, by, bw, 26, 13, 'rgba(0,0,0,.6)');
      rr(W / 2 - bw / 2 + 3, by + 3, (bw - 6) * Math.max(0, m.hp / m.maxHp), 20, 10, '#e33b2e');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('MARIO', W / 2, by + 20); ctx.textAlign = 'left';
      drawHUD('');
    }
  });
}

/* ---------------- L2.2  dodge the spacecraft's beams ---------------- */

function sceneRunAway() {
  const p = makeFighter();
  p.x = 300;
  const NEED = 6;
  let beams = [], fired = 0, spawnT = 1.0, t = 0, done = false;
  const ship = { x: 640, y: 120, dir: -1 };

  setScene({
    pInvulnRef: p,
    update(dt) {
      if (done) return;
      t += dt;
      fighterPhysics(p, dt);

      ship.x += ship.dir * 90 * dt;
      if (ship.x < 180) ship.dir = 1;
      if (ship.x > 760) ship.dir = -1;
      ship.y = 120 + Math.sin(t * 1.4) * 12;

      spawnT -= dt;
      if (spawnT <= 0 && fired < NEED) {
        fired++;
        spawnT = 1.7;
        beams.push({ x: p.x + p.vx * 0.35, warn: 0.95, live: 0, spent: false });
        beep(300, 0.12, 'sine', 0.08);
      }

      for (const b of beams) {
        if (b.warn > 0) {
          b.warn -= dt;
          if (b.warn <= 0) { b.live = 0.45; beep(900, 0.2, 'sawtooth', 0.1); S.shake = 10; }
        } else if (b.live > 0) {
          b.live -= dt;
          if (!b.spent && Math.abs(p.x - b.x) < 42 && p.onGround) {
            b.spent = true; hurtPlayer(8);
          }
          if (b.live <= 0 && !b.spent) { b.spent = true; S.beamsDodged++; floatText(b.x, GROUND - 60, 'DODGED!', '#4ede77'); }
        }
      }
      beams = beams.filter(b => b.warn > 0 || b.live > 0);

      if (S.hp <= 0) { done = true; setTimeout(() => gameOver(sceneRunAway), 400); }
      else if (fired >= NEED && beams.length === 0) {

      drawHero(p.x, p.y, { face: p.face, hurt: p.invuln > 0, bob: p.vx !== 0 ? p.t * 12 : 0 });

  });

function sceneGather() {
  const p = makeFighter();

  const items = SLING_PARTS.map((k, i) => ({
    kind: k, idx: i,

      for (const it of items) {
        if (it.taken) continue;
        const fy = it.y + Math.sin(it.t * 3) * 5;
        ctx.save(); ctx.translate(it.x, fy);
        ctx.globalAlpha = it.idx === got ? 0.42 : 0.16;
        ctx.fillStyle = it.idx === got ? '#ffd54a' : '#ffffff';

      drawHUD('PARTS: ' + got + ' / 3');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText(got < 3 ? 'NEXT: ' + SLING_PARTS[got].n : 'GO GET THAT SPACECRAFT!', W / 2, 40);
      ctx.textAlign = 'left';
    }
  });
}

  ], () => {

    drawSlingshot(184, GROUND - 24, 0.4, 1.0, true);

const SLING_G = 900;
/* Tuned so about half of all sensible angle/power combos can actually reach the
   spacecraft — at the original speed only near-max power ever got there. */
const SLING_SPEED = pw => 340 + pw * 700;
const SHIP_Y = 155;

function sceneSlingshot() {
  const SX = 150, SY = GROUND - 24;         // slingshot muzzle
  let angle = 0.85, power = 0, charging = false, t = 0, done = false;
  let shots = [], hits = 0;
  const ship = { x: 640, y: SHIP_Y, dir: -1, hurtT: 0, hp: 3, maxHp: 3 };

  window.__sling = () => ({ angle, power, shipX: ship.x, shipY: ship.y, hits });  // playtest hook

  function fire() {
    const sp = SLING_SPEED(power);
    shots.push({ x: SX, y: SY - 18, vx: Math.cos(angle) * sp, vy: -Math.sin(angle) * sp, t: 0 });
    S.shotsFired++;
    beep(520, 0.12, 'square', 0.11);
  }

  setScene({
    update(dt) {
      if (done) return;
      t += dt;

      if (keys.ArrowUp) angle = Math.min(1.42, angle + dt * 0.9);
      if (keys.ArrowDown) angle = Math.max(0.12, angle - dt * 0.9);

      if (keys.Space) {
        if (!charging) charging = true;
        power = Math.min(1, power + dt * 0.85);
      } else if (charging) {
        charging = false; fire(); power = 0;
      }

      // ship patrols, faster as it takes damage
      const spd = 90 + hits * 45;
      ship.x += ship.dir * spd * dt;
      if (ship.x < 330) ship.dir = 1;
      if (ship.x > 800) ship.dir = -1;
      ship.y = SHIP_Y + Math.sin(t * 1.5) * 14;
      if (ship.hurtT > 0) ship.hurtT -= dt;

      for (const s of shots) {
        s.t += dt;
        s.x += s.vx * dt; s.vy += SLING_G * dt; s.y += s.vy * dt;
        if (ship.hurtT <= 0 && Math.abs(s.x - ship.x) < 78 && Math.abs(s.y - ship.y) < 42) {
          s.t = 99; hits++; S.shipHits = hits; ship.hurtT = 0.5;
          burst(s.x, s.y, '#ffd54a', 22, 300);
          floatText(ship.x, ship.y - 60, 'HIT! ' + hits + '/3', '#4ede77');
          beep(880, 0.14, 'square', 0.12); S.shake = 12;
          if (hits >= 3) {
            done = true; fanfare();
            setTimeout(sceneCrash, 1100);
          }
        }
        if (s.y > GROUND + 34) { burst(s.x, GROUND + 28, '#a89a86', 8, 150); s.t = 99; }
      }
      shots = shots.filter(s => s.t < 9 && s.x < W + 60);
    },
    draw() {
      drawNeighborhood(t, false, null);
      drawSpacecraft(ship.x, ship.y, 0.72, t, { hurtT: ship.hurtT, hp: ship.hp - hits, maxHp: ship.maxHp, face: ship.dir });

      // dotted trajectory preview — this is what makes it fair for a small kid
      const psp = SLING_SPEED(power);
      let px = SX, py = SY - 18, pvx = Math.cos(angle) * psp, pvy = -Math.sin(angle) * psp;
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      for (let i = 0; i < 34; i++) {
        px += pvx * 0.045; pvy += SLING_G * 0.045; py += pvy * 0.045;
        if (py > GROUND + 30 || px > W) break;
        ctx.globalAlpha = 0.75 - i * 0.018;
        ctx.beginPath(); ctx.arc(px, py, 3.2, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const s of shots) if (s.t < 9) circle(s.x, s.y, 8, '#6e6357');

      drawHero(SX - 34, GROUND + 40, { face: 1 });
      drawSlingshot(SX, SY, power, angle, true);

      // power meter
      rr(24, GROUND + 54, 220, 22, 11, 'rgba(0,0,0,.6)');
      rr(27, GROUND + 57, 214 * power, 16, 8, power > 0.8 ? '#ff5a4a' : '#ffd54a');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Trebuchet MS';
      ctx.fillText('POWER (hold SPACE)', 32, GROUND + 71);

      drawHUD('HITS: ' + hits + ' / 3');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('↑ ↓ to aim', W / 2, 40); ctx.textAlign = 'left';
    }
  });
}

function sceneRageIntro() {
  dialogue([
    { who: S.name, text: 'My. House.', color: '#4fc3f7' },
    { who: S.name, text: 'I am going to EXPLODE IN ANGER!!!', color: '#ff5a4a' },
    { who: 'LAST CHALLENGE', text: 'You explode! Now survive it — dodge the falling stuff.', color: '#ffd54a' },
    { who: 'LAST CHALLENGE', text: 'If you don\'t die... YOU WIN!', color: '#ffd54a' }
  ], () => {
    drawNeighborhood(7, true, null);
    drawHero(180, GROUND + 40, { face: 1 });
  }, sceneRage);

function sceneRage() {
  const p = makeFighter();
  p.x = W / 2;
  const SURVIVE = 20;
  let t = 0, left = SURVIVE, junk = [], spawnT = 0.6, done = false;
  S.hp = S.maxHp;

  setScene({
    pInvulnRef: p,
    update(dt) {
      if (done) return;
      t += dt; left -= dt;
      S.ragePct = Math.min(100, Math.round((1 - left / SURVIVE) * 100));
      fighterPhysics(p, dt);
      S.shake = Math.max(S.shake, 3);

      // it gets angrier as the meter fills
      const rate = 0.62 - (1 - left / SURVIVE) * 0.3;
      spawnT -= dt;
      if (spawnT <= 0) {
        spawnT = rate;
        junk.push({
          x: 50 + Math.random() * (W - 100), y: -40,
          vy: 190 + Math.random() * 170, r: 15 + Math.random() * 12,
          spin: Math.random() * 6, hot: Math.random() < 0.5, spent: false
        });
      }

      for (const j of junk) {
        j.y += j.vy * dt; j.spin += dt * 5;
        if (!j.spent && Math.abs(j.x - p.x) < j.r + 20 && Math.abs(j.y - (p.y - 45)) < j.r + 44) {
          j.spent = true; hurtPlayer(9);
          burst(j.x, j.y, '#ff8a3d', 12);
        }
        if (j.y > GROUND + 34 && !j.spent) {
          j.spent = true; burst(j.x, GROUND + 28, j.hot ? '#ff8a3d' : '#8a7256', 8, 160);
        }
      }
      junk = junk.filter(j => j.y < H + 60);

      if (S.hp <= 0) { done = true; setTimeout(() => gameOver(sceneRage), 400); }
      else if (left <= 0) {
        done = true; S.flash = 1.4; S.shake = 30; boomSound();
        burst(p.x, p.y - 50, '#ff5a4a', 50, 460);
        setTimeout(() => sceneWin(2), 1200);
      }
    },
    draw() {
      // sky reddens as the rage meter climbs
      const rage = 1 - left / SURVIVE;
      drawSky(`rgb(${40 + rage * 90},${20 + rage * 10},${50 - rage * 20})`, `rgb(${150 + rage * 90},${70 - rage * 30},${40})`);
      drawGround('#4a3a2e', '#5a4636');
      ctx.fillStyle = '#4a4a52'; ctx.fillRect(0, GROUND + 52, W, 40);
      drawHouse(450, GROUND, true, t);

      for (const j of junk) {
        if (j.spent) continue;
        ctx.save(); ctx.translate(j.x, j.y); ctx.rotate(j.spin);
        if (j.hot) {
          circle(0, 0, j.r, '#ff8a1f'); circle(0, 0, j.r * 0.55, '#ffe14a');
        } else {
          ctx.fillStyle = '#7a6650';
          ctx.fillRect(-j.r, -j.r * 0.7, j.r * 2, j.r * 1.4);
          ctx.fillStyle = '#5f4f3d'; ctx.fillRect(-j.r * 0.6, -j.r * 0.3, j.r * 1.2, j.r * 0.6);
        }
        ctx.restore();
        if (j.hot && Math.random() < 0.3) burst(j.x, j.y, '#ff8a3d', 1, 60);
      }

      // the hero, visibly furious
      const glow = 0.35 + Math.abs(Math.sin(t * 8)) * 0.4;
      ctx.globalAlpha = glow * rage;
      circle(p.x, p.y - 50, 54 + rage * 26, '#ff4d3d');
      ctx.globalAlpha = 1;
      drawHero(p.x, p.y, { face: p.face, hurt: p.invuln > 0, bob: t * 16 });
      if (Math.random() < 0.35 * rage) burst(p.x + (Math.random() - 0.5) * 50, p.y - 60, '#ff8a3d', 1, 90);

      drawHUD('SURVIVE: ' + Math.max(0, Math.ceil(left)) + 's');
      // rage meter
      const bw = 300;
      rr(W / 2 - bw / 2, 16, bw, 24, 12, 'rgba(0,0,0,.6)');
      rr(W / 2 - bw / 2 + 3, 19, (bw - 6) * rage, 18, 9, '#ff4d3d');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('ANGER ' + S.ragePct + '%', W / 2, 34); ctx.textAlign = 'left';
    }
  });
}

/* ======================================================================== */
/*                        GAME OVER / VICTORY                                */
/* ======================================================================== */

function gameOver(retryScene) {
  setScene({
    enter() {
      boomSound();
      const p = el('div', 'panel'); p.style.top = '28%'; p.style.width = '70%';
      p.appendChild(el('div', 'title-big', 'OW!'));
      p.appendChild(el('div', 'sub', 'You ran out of hearts. Shake it off — heroes always get back up.'));
      const row = el('div');
      row.appendChild(button('TRY AGAIN ▶', 'big green', () => {
        S.hp = S.maxHp; retryScene();
      }));
      p.appendChild(row);
      ui.appendChild(p);
    },
    draw() {
      drawSky('#1a0d14', '#3a1a22');
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    }
  });
}

function sceneWin(level) {
  let t = 0;
  const lv = level || S.level;
  setScene({
    enter() {
      const p = el('div', 'panel'); p.style.top = '7%'; p.style.width = '58%';
      p.appendChild(el('div', 'title-big', 'YOU WIN!!'));
      const stats = lv === 2
        ? `☄️ Beams dodged: <b>${S.beamsDodged}</b><br>` +
          `🎒 Slingshot parts: <b>${S.partsFound} / 3</b><br>` +
          `🎯 Hits on the spacecraft: <b>${S.shipHits} / 3</b> (in ${S.shotsFired} shots)<br>` +
          `🏠 Your house: <b>GONE</b><br>` +
          `😡 Anger: <b>${S.ragePct}%</b> — and you survived it!`
        : `🐺 Animals beaten: <b>${S.kills}</b><br>` +
          `🎒 Supplies grabbed: <b>${S.supplies}</b><br>` +
          `💣 Bombs defused: <b>${S.bombsDefused}</b><br>` +
          `💰 Loot: <b>ALL OF IT</b><br>` +
          `🍄 Mario: <b>DEFEATED</b>`;
      p.appendChild(el('div', 'sub',
        `<b style="font-size:26px;color:#ffd54a">${S.name}</b> beat ` +
        `<b>LEVEL ${lv}</b>${lv === 2 ? ' — THE SPACECRAFT' : ' — THE BOMB'}!<br><br>` + stats
      ));
      p.appendChild(button('PLAY AGAIN ▶', 'big green', () => {
        S.hp = S.maxHp; S.kills = 0; S.supplies = 0; S.bombsDefused = 0; S.loot = 0;
        S.beamsDodged = 0; S.partsFound = 0; S.shipHits = 0; S.shotsFired = 0; S.ragePct = 0;
        sceneTitle();
      }));
      ui.appendChild(p);
      fanfare();
    },
    update(dt) {
      t += dt;
      if (Math.random() < 0.35) {
        parts.push({
          x: Math.random() * W, y: -10,
          vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 120,
          life: 3, r: 4 + Math.random() * 5,
          color: ['#ffd54a', '#4ede77', '#4fa3ff', '#ff6b9d', '#c46bff'][Math.floor(Math.random() * 5)]
        });
      }
    },
    draw() {
      drawSky('#12203a', '#2f4f8a');
      marioBGStars(t);
      drawGround('#3a5a34', '#456b3e');
      // stand clear of the results panel so the hero is actually visible
      drawHero(130, GROUND + 40, { face: 1, bob: t * 4, swing: (Math.sin(t * 4) + 1) / 2 * 0.5 });
      drawFriend(770, GROUND + 40, { face: -1 });
    }
  });
}

function marioBGStars(t) {
  for (let i = 0; i < 40; i++) {
    const x = (i * 137) % W, y = (i * 79) % (GROUND - 40);
    const tw = 0.4 + Math.abs(Math.sin(t * 2 + i)) * 0.6;
    ctx.globalAlpha = tw; circle(x, y, 2.2, '#fff');
  }
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------------ */
sceneTitle();
</script>
</body>
</html>
